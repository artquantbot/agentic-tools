name: Deploy
on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment
        type: choice
        options: [preview, production]
        default: preview
        required: true
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    concurrency:
      group: agentic-tools-${{ inputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test && npm run evaluate && npm run build
      - name: Deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$TARGET" = production ]; then
            npx cf deploy --prebuilt
            curl --fail --retry 5 --retry-all-errors --retry-delay 4 https://agentic-tools.ususuni.com/api/v1/health
          else
            npx cf previews deploy
          fi
