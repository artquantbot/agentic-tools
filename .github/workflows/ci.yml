name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit signatures
      - run: npm test
      - run: npm run evaluate
      - run: npm run build
      - name: Run approved synthetic FFmpeg fixture in Docker
        run: |
          IMAGE="$(node --experimental-strip-types --input-type=module -e 'import { videoSmoke } from "./src/studio.ts"; console.log(videoSmoke.image)')"
          docker pull "$IMAGE"
          node --experimental-strip-types scripts/test-docker.ts
          test -z "$(docker ps -aq --filter label=org.agentic-tools.scope=video-smoke)"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
