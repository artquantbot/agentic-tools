name: Production smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Verify HTTPS website and REST
        env:
          BASE: https://agentic-tools.ususuni.com
        run: |
          curl -fsS --retry 8 --retry-all-errors --retry-delay 10 --max-time 15 "$BASE/api/v1/health" | jq -e '.status == "ok" and .count >= 40'
          for path in / /api/v1/health /mcp; do
            curl -sSI --max-time 15 "http://agentic-tools.ususuni.com$path" | grep -qi "^location: $BASE$path"
          done
          for path in / /api/v1/health; do
            curl -fsSD - --max-time 15 -o /dev/null "$BASE$path" | grep -qi '^strict-transport-security: max-age='
          done
          curl -fsS --max-time 15 "$BASE/.well-known/security.txt" | grep -q '^Contact: https://github.com/artquantbot/agentic-tools/security/advisories/new'
          status=$(curl -sS --max-time 15 -o /tmp/mcp-rejection.json -w '%{http_code}' "$BASE/mcp" -H 'Content-Type: application/json' -d '[]')
          test "$status" = 400
          jq -e '.error.code == "mcp_batch_not_supported"' /tmp/mcp-rejection.json
          curl -fsS --max-time 15 "$BASE/discover" | grep -q '<title>Agentic Tools'
          curl -fsS --max-time 15 "$BASE/api/v1/search" -H 'Content-Type: application/json' \
            -d '{"query":"Run an LLM locally on a Mac"}' | jq -e '.total > 0 and (.results[0].evidence | length > 0)'
      - run: npm ci
      - name: Verify production MCP tools
        env:
          MCP_TEST_URL: https://agentic-tools.ususuni.com/mcp
        run: node --test tests/mcp.test.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: https://agentic-tools.ususuni.com
